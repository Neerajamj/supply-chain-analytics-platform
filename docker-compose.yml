services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flowops]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://flowops:flowops@db:5432/flowops
      SECRET_KEY: change-this-before-production
      CORS_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    ports: [8000:8000]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./frontend
    ports: [5173:80]
    depends_on: [api]
volumes:
  postgres_data:
